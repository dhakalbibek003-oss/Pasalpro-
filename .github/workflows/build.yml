name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.3'
          channel: 'stable'

      - name: Unzip Project
        run: |
          unzip -q pasalpro_final_release_candidate.zip -d extracted_project
          echo "PROJECT_PATH=$(find extracted_project -name pubspec.yaml -exec dirname {} \; | head -n 1)" >> $GITHUB_ENV

      - name: Get Dependencies
        run: |
          cd ${{ env.PROJECT_PATH }}
          flutter pub get

      - name: Build APK
        run: |
          cd ${{ env.PROJECT_PATH }}
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pasalpro-release-apk
          path: ${{ env.PROJECT_PATH }}/build/app/outputs/flutter-apk/app-release.apk
          
